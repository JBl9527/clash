; ==============================
; 2. 节点正则筛选组 (从订阅自动筛选地区)
; 语法：组名`类型`所有节点标志(.*)`正则筛选`测试地址`测试间隔`容差
; ==============================
custom_proxy_group=🇭🇰 香港节点`select`.*`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$
custom_proxy_group=🇯🇵 日本节点`select`.*`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$
custom_proxy_group=🇸🇬 狮城节点`select`.*`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|深|美)).)*$
custom_proxy_group=🇺🇲 美国节点`select`.*`(?=.*(美|US|(?i)States|America))^((?!(港|台|韩|新|日)).)*$

custom_proxy_group=🔯 香港故转`fallback`.*`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🔯 日本故转`fallback`.*`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🔯 狮城故转`fallback`.*`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|深|美)).)*$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🔯 美国故转`fallback`.*`(?=.*(美|US|(?i)States|America))^((?!(港|台|韩|新|日)).)*$`http://www.gstatic.com/generate_204`300

custom_proxy_group=♻️ 香港自动`url-test`.*`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$`http://www.gstatic.com/generate_204`300`20
custom_proxy_group=♻️ 日本自动`url-test`.*`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$`http://www.gstatic.com/generate_204`300`20
custom_proxy_group=♻️ 狮城自动`url-test`.*`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|韩|日|美)).)*$`http://www.gstatic.com/generate_204`300`20
custom_proxy_group=♻️ 美国自动`url-test`.*`(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$`http://www.gstatic.com/generate_204`300`20
custom_proxy_group=♻️ 自动选择`url-test`.*`^((?!(直连)).)*$`http://www.gstatic.com/generate_204`300`20
custom_proxy_group=🌐 全部节点`select`.*

